    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --link-color: #58a6ff;
            --border-color: #30363d;
            --nav-bg: #161b22;
            --card-bg: #161b22;
        }
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #24292f;
            --link-color: #0969da;
            --border-color: #d0d7de;
            --nav-bg: #f6f8fa;
            --card-bg: #f6f8fa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex; gap: 10px;
        }
        .control-btn {
            background: var(--nav-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        #nav-menu { position: fixed; top: 20px; left: 20px; z-index: 1000; }
        .menu-icon {
            font-size: 20px; cursor: pointer; background: var(--nav-bg);
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 1px solid var(--border-color);
        }
        .menu-content {
            display: none; position: absolute; top: 45px; left: 0;
            background: var(--nav-bg); border: 1px solid var(--border-color);
            border-radius: 6px; width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .menu-content a { display: block; color: var(--text-color); padding: 12px 16px; text-decoration: none; border-bottom: 1px solid var(--border-color); }
        .container { max-width: 800px; margin: 0 auto; padding: 100px 20px; }
        h1 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 40px; color: #8b949e; }
        
        .month-section { margin-bottom: 40px; }
        .blog-post {
            margin-bottom: 20px;
            padding: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .blog-post:hover { transform: translateY(-2px); border-color: var(--link-color); }
        .blog-post a { text-decoration: none; color: inherit; display: block; }
        .blog-date { font-size: 0.85em; color: #8b949e; }
        .blog-title { font-size: 1.2em; font-weight: bold; margin: 5px 0; color: var(--link-color); }
        .blog-summary { font-size: 0.95em; margin-top: 5px; }
        
        .footer { font-size: 0.8em; color: #8b949e; margin-top: 60px; text-align: center; }
        [data-lang] { display: none; }
    </style>
</head>
<body data-theme="dark">

    <div id="controls">
        <button class="control-btn" onclick="toggleLang()" id="langBtn">EN</button>
        <button class="control-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>

    <div id="nav-menu">

        <div class="menu-content" id="menuContent">

            <a href="./blog.html" class="i18n" data-ja="活動記録" data-en="Blog">活動記録</a>
            <a href="./achievements.html" class="i18n" data-ja="研究実績" data-en="Achievements">研究実績</a>
            <a href="./projects.html" class="i18n" data-ja="プロジェクト" data-en="Projects">プロジェクト</a>
            <a href="./index.html#contact" class="i18n" data-ja="連絡先" data-en="Contact">連絡先</a>
        </div>
    </div>

    <div class="container">
        <h1 class="i18n" data-ja="活動記録 / ブログ" data-en="Blog & Logs">活動記録 / ブログ</h1>
        <p class="i18n" data-ja="研究の進捗や技術的な知見を月ごとにまとめています。" data-en="Monthly logs of research progress and technical insights.">研究の進捗や技術的な知見を月ごとにまとめています。</p>

        <hr>

        <!-- 2026年4月 -->
        <div class="month-section">
            <h2 class="i18n" data-ja="2026年 4月" data-en="April 2026">2026年 4月</h2>
            
            <article class="blog-post">
                <a href="./posts/2026-04-01-launch.html">
                    <div class="blog-date">2026-04-01</div>
                    <div class="blog-title i18n" data-ja="ポートフォリオサイトの設計思想と公開" data-en="Portfolio Site: Design Philosophy & Launch">ポートフォリオサイトの設計思想と公開</div>
                    <div class="blog-summary i18n" 
                         data-ja="専門家向けのProof of Workとしてのサイト構築。技術的エビデンスを重視した構成について。" 
                         data-en="Constructing a site as a 'Proof of Work' for experts. Focusing on technical evidence.">
                         専門家向けのProof of Workとしてのサイト構築。
                    </div>
                </a>
            </article>
        </div>

        <!-- 2026年2月 -->
        <div class="month-section">
            <h2 class="i18n" data-ja="2026年 2月" data-en="February 2026">2026年 2月</h2>
            
            <article class="blog-post">
                <a href="./posts/2026-02-25-euos25-review.html">
                    <div class="blog-date">2026-02-25</div>
                    <div class="blog-title i18n" data-ja="EUOS25 challenge 優勝の技術的背景" data-en="Technical Review: EUOS25 Challenge Win">EUOS25 challenge 優勝の技術的背景</div>
                    <div class="blog-summary i18n" 
                         data-ja="量子化学計算による構造最適化とKANを組み合わせた予測アプローチの詳解。" 
                         data-en="In-depth review of the predictive approach combining quantum chemistry and KAN.">
                         量子化学計算による構造最適化とKANを組み合わせた予測アプローチの詳解。
                    </div>
                </a>
            </article>
        </div>

        <div class="footer">
            <p>© 2026 Wataru Miyahara</p>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('lang') || 'ja';
        function updateLang() {
            document.querySelectorAll('.i18n').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + currentLang);
            });
            document.getElementById('langBtn').innerText = currentLang === 'ja' ? 'EN' : 'JP';
            document.documentElement.lang = currentLang;
            localStorage.setItem('lang', currentLang);
        }
        function toggleLang() { currentLang = currentLang === 'ja' ? 'en' : 'ja'; updateLang(); }
        let currentTheme = localStorage.getItem('theme') || 'dark';
        function updateTheme() {
            document.body.setAttribute('data-theme', currentTheme);
            document.getElementById('themeBtn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', currentTheme);
        }
        function toggleTheme() { currentTheme = currentTheme === 'dark' ? 'light' : 'dark'; updateTheme(); }
        function toggleMenu() {
            var content = document.getElementById("menuContent");
            content.style.display = content.style.display === "block" ? "none" : "block";
        }
        window.onclick = function(event) { if (!event.target.matches('.menu-icon')) { document.getElementById("menuContent").style.display = "none"; } }
        updateLang(); updateTheme();
    </script>
</body>
</html>
