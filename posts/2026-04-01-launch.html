<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SDV8KXD68X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-SDV8KXD68X');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Title | Blog | 宮原 渉</title>
    
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --link-color: #58a6ff;
            --border-color: #30363d;
            --nav-bg: #161b22;
            --card-bg: #161b22;
        }
        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #24292f;
            --link-color: #0969da;
            --border-color: #d0d7de;
            --nav-bg: #f6f8fa;
            --card-bg: #f6f8fa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        #controls { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px; }
        .control-btn { background: var(--nav-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        #nav-menu { position: fixed; top: 20px; left: 20px; z-index: 1000; }
        .menu-icon { font-size: 20px; cursor: pointer; background: var(--nav-bg); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid var(--border-color); }
        .menu-content { display: none; position: absolute; top: 45px; left: 0; background: var(--nav-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 180px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .menu-content a { display: block; color: var(--text-color); padding: 12px 16px; text-decoration: none; border-bottom: 1px solid var(--border-color); }
        .container { max-width: 800px; margin: 0 auto; padding: 100px 20px; }
        h1 { line-height: 1.3; margin-bottom: 10px; }
        .post-meta { font-size: 0.9em; color: #8b949e; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .post-content { margin-top: 20px; }
        .post-content h2 { margin-top: 40px; border-bottom: 1px solid var(--border-color); }
        .footer { font-size: 0.8em; color: #8b949e; margin-top: 60px; text-align: center; }
        [data-lang] { display: none; }
        .back-link { margin-bottom: 20px; display: inline-block; text-decoration: none; color: var(--link-color); }
    </style>
</head>
<body data-theme="dark">

    <div id="controls">
        <button class="control-btn" onclick="toggleLang()" id="langBtn">EN</button>
        <button class="control-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <div id="nav-menu">
        <div class="menu-icon" onclick="toggleMenu()">⋮</div>
        <div class="menu-content" id="menuContent">
            <a href="../index.html" class="i18n" data-ja="ホーム" data-en="Home">ホーム</a>
            <a href="../blog.html" class="i18n" data-ja="活動記録" data-en="Blog">活動記録</a>
            <a href="../achievements.html" class="i18n" data-ja="研究実績" data-en="Achievements">研究実績</a>
            <a href="../projects.html" class="i18n" data-ja="プロジェクト" data-en="Projects">プロジェクト</a>
            <a href="../index.html#contact" class="i18n" data-ja="連絡先" data-en="Contact">連絡先</a>
        </div>
    </div>

    <div class="container">
        <a href="../blog.html" class="back-link i18n" data-ja="← ブログ一覧に戻る" data-en="← Back to Blog List">← ブログ一覧に戻る</a>
        
        <article>
            <h1 class="i18n" data-ja="記事のタイトルをここに入力" data-en="Post Title Here">記事のタイトルをここに入力</h1>
            <div class="post-meta">2026-04-01</div>
            
            <div class="post-content">
                <p class="i18n" data-ja="ここから本文を書き始めます。" data-en="Start writing your post here.">ここから本文を書き始めます。</p>
                
                <h2 class="i18n" data-ja="小見出し" data-en="Subheading">小見出し</h2>
                <p class="i18n" data-ja="詳細な内容を記載します。" data-en="Detailed content goes here.">詳細な内容を記載します。</p>
            </div>
        </article>

        <div class="footer">
            <p>© 2026 Wataru Miyahara</p>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('lang') || 'ja';
        function updateLang() {
            document.querySelectorAll('.i18n').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + currentLang);
            });
            document.getElementById('langBtn').innerText = currentLang === 'ja' ? 'EN' : 'JP';
            document.documentElement.lang = currentLang;
            localStorage.setItem('lang', currentLang);
        }
        function toggleLang() { currentLang = currentLang === 'ja' ? 'en' : 'ja'; updateLang(); }
        let currentTheme = localStorage.getItem('theme') || 'dark';
        function updateTheme() {
            document.body.setAttribute('data-theme', currentTheme);
            document.getElementById('themeBtn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', currentTheme);
        }
        function toggleTheme() { currentTheme = currentTheme === 'dark' ? 'light' : 'dark'; updateTheme(); }
        function toggleMenu() {
            var content = document.getElementById("menuContent");
            content.style.display = content.style.display === "block" ? "none" : "block";
        }
        window.onclick = function(event) { if (!event.target.matches('.menu-icon')) { document.getElementById("menuContent").style.display = "none"; } }
        updateLang(); updateTheme();
    </script>
</body>
</html>
